[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-frameworks-codex-adapter"
version = "0.1.0"
description = "Optional Codex App Server adapter for CognitiveFrameWorks"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "cognitive-frameworks-runtime>=1.4,<2",
    "cognitive-runtime-core>=1.5,<2",
    "cognitive-runtime-codex-adapter>=0.2,<1",
]

[tool.setuptools]
packages = ["codex_host"]
py-modules = ["codex_app_server_adapter", "codex_app_server_dp_bridge"]
package-dir = {"" = "../../scripts"}
