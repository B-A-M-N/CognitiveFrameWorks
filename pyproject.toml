[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cognitive-frameworks-runtime"
version = "1.4.0"
description = "Host-owned Cognitive Runtime and CognitiveFrameWorks policy compiler"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["jsonschema>=4.18", "PyYAML>=6.0"]

[tool.setuptools]
packages = ["runtime_contract"]
package-dir = {runtime_contract = "scripts/runtime_contract"}

[tool.setuptools.package-data]
runtime_contract = ["*.py", "contracts/*.json"]
